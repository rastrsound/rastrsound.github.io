<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 24px 0;
    }

    .description {
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 8px 0;
    }

    .credit {
      font-size: 8px;
      font-style: italic;
      opacity: 0.65;
      margin: 0 0 35px 0;
    }

    audio {
      display: block;
      width: 100%;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <main>
    <h1>Rannan ääniä</h1>

    <p class="description">
      Äänitetty Liuskasaaressa Helsingissä heinäkuussa 2022
    </p>

    <p class="credit">
      Äänitys: Heikki Lindgren
    </p>

    <audio controls loop src="Ranta.mp3">
      Selaimesi ei tue äänentoistoa.
    </audio>
  </main>

</body>
</html>
